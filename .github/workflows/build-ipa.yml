name: Build unsigned IPA (personal sideload)

on:
  workflow_dispatch:
  push:
    branches:
      - build-ipa

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download iOS platform
        run: xcodebuild -downloadPlatform iOS

      - name: Build for device without signing
        run: |
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.ginlime.moonlight-ko \
            clean build

      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/Moonlight.app
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Moonlight KO'" "$APP/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Moonlight KO'" "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Moonlight-KO.ipa Payload
          ls -la Moonlight-KO.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-KO-ipa
          path: Moonlight-KO.ipa
